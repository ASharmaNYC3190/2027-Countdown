<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 Countdown</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #58a6ff;
        }
        #countdown {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .time-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 20px;
            text-align: center;
            min-width: 80px;
        }
        .number {
            font-size: 3rem;
            font-weight: bold;
            color: #f0f6fc;
            display: block;
        }
        .label {
            font-size: 0.9rem;
            color: #8b949e;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <h1>Countdown to 2027</h1>
    <div id="countdown">
        <div class="time-box"><span class="number" id="months">00</span><span class="label">Months</span></div>
        <div class="time-box"><span class="number" id="days">00</span><span class="label">Days</span></div>
        <div class="time-box"><span class="number" id="hours">00</span><span class="label">Hours</span></div>
        <div class="time-box"><span class="number" id="minutes">00</span><span class="label">Mins</span></div>
        <div class="time-box"><span class="number" id="seconds">00</span><span class="label">Secs</span></div>
    </div>

    <script>
        const targetDate = new Date('January 1, 2027 00:00:00');

        function updateCountdown() {
            const now = new Date();
            let difference = targetDate - now;

            if (difference < 0) {
                document.getElementById('countdown').innerHTML = "<h2>Happy New Year 2027! 🎉</h2>";
                clearInterval(intervalId);
                return;
            }

            // Calculate calendar months and days breakdown
            let currentYear = now.getFullYear();
            let currentMonth = now.getMonth();
            
            let targetYear = targetDate.getFullYear();
            let targetMonth = targetDate.getMonth();

            let months = (targetYear - currentYear) * 12 + (targetMonth - currentMonth);
            
            // Adjust if current day of month is past the target day of month
            let tempDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
            tempDate.setMonth(tempDate.getMonth() + months);
            
            if (tempDate > targetDate) {
                months--;
                tempDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds());
                tempDate.setMonth(tempDate.getMonth() + months);
            }

            // Remaining time after calculating full months
            let remainingMs = targetDate - tempDate;

            const days = Math.floor(remainingMs / (1000 * 60 * 60 * 24));
            const hours = Math.floor((remainingMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((remainingMs % (1000 * 60)) / 1000);

            document.getElementById('months').innerText = String(months).padStart(2, '0');
            document.getElementById('days').innerText = String(days).padStart(2, '0');
            document.getElementById('hours').innerText = String(hours).padStart(2, '0');
            document.getElementById('minutes').innerText = String(minutes).padStart(2, '0');
            document.getElementById('seconds').innerText = String(seconds).padStart(2, '0');
        }

        const intervalId = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
